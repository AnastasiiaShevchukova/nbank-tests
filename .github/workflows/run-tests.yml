name: Run tests

# триггер
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Build project
        run: ./mvnw clean package -DskipTests

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check

      - name: Set up services
        run: cd infra/docker_compose && bash restart_docker.sh && cd ../..

      - name: Run tests
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-output/**/results

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-output/**/report

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: test-output/**/logs

      - name: Push image
        run: |
            chmod +x push-tests.sh
            ./push-tests.sh ${GITHUB_SHA}

      - name: Debug Swagger Coverage
        run: |
          pwd
          ls -la
          ls -la .swagger-coverage-commandline || true
          ls -la .swagger-coverage-commandline/bin || true 

      - name: Run Swagger coverage
        if: always()
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s http://localhost:4111/v3/api-docs -i target/swagger-coverage-output

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Allure
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -xzf allure-2.34.1.tgz
          sudo mv allure-2.34.1 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure

      - name: Prepare report directories
        if: always()
        run: |
          mkdir -p allure-history
          mkdir -p allure-history/${{ github.run_number }}

          if [ -d "gh-pages/latest/history" ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/latest/history/* target/allure-results/history/ || true
          fi

      - name: Build Allure Report
        if: always()
        run: |
          echo "=== Searching allure-results ==="
          find . -type d -name allure-results

          ALLURE_RESULTS=$(find . -type d -name allure-results | head -1)

          echo "Found: $ALLURE_RESULTS"

          ls -la "$ALLURE_RESULTS"
          find "$ALLURE_RESULTS" -type f | head -20

          allure generate "$ALLURE_RESULTS" \
            --clean \
            -o allure-history/${{ github.run_number }}

      - name: Create latest report
        if: always()
        run: |
          rm -rf allure-history/latest
          cp -r allure-history/${{ github.run_number }} allure-history/latest

      - name: Copy Swagger Coverage Report
        if: always()
        run: |
          cp swagger-coverage-report.html allure-history/${{ github.run_number }}/swagger-coverage-report.html || true
          cp swagger-coverage-report.html allure-history/latest/swagger-coverage-report.html || true

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Clean up services
        if: always()
        run: cd infra/docker_compose && docker compose down