services:
  nbank:
    image: nobugsme/nbank:with_fraud_check_with_transfer_fix
    container_name: nbank-app
    ports:
      - "4111:4111"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nbank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      FRAUD_DETECTION_SERVICE_URL: http://host.docker.internal:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4111/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

